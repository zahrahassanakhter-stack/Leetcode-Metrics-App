<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="lettcoemerics.css" />
  </head>
  <body>
    <div class="container">
      <h1>Leetcode Metrics</h1>

      <div class="user-container">
        <p>Enter username</p>
        <div class="user-input-container">
          <input id="inputfield" type="text" placeholder="Enter your name" />
          <button id="searchbar">Search</button>
        </div>
      </div>

      <div class="stats-container">
        <div class="progress">
          <div class="progress-item">
            <div class="Easy-progress circle">
              <span class="Easy-label"> Easy </span>
            </div>
          </div>

          <div class="progress-item">
            <div class="Medium-progress circle">
              <span class="Medium label"> Medium </span>
            </div>
          </div>

          <div class="progress-item">
            <div class="hard-progress circle">
              <span class="hard-label"> Hard </span>
            </div>
          </div>
        </div>
      
          
        </div>
      </div>
    </div>
    <script src="leetcodemetrics.js"></script>
  </body>
</html>
